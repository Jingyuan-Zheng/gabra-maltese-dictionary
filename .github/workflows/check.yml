name: Check dictionary tooling
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/convert_to_mdx.py sources/gabra/Body.data --output-dir build/mdx --report build/validation.json
      - run: python scripts/check_mdx_index.py build/mdx/Gabra.mdx
      - run: bash -n scripts/update_macos.sh
